<!-- templates/admin/grievances.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Grievances - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold">
                <i class="fas fa-list text-primary me-2"></i>
                All Grievances
            </h1>
            <p class="text-muted">View all grievances across all departments</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Student</th>
                        <th>Title</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Assigned To</th>
                        <th>Filed On</th>
                        <th>Resolved On</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="g : ${grievances}">
                        <td>
                            <span class="badge bg-light text-dark" th:text="${g.grievanceNumber}">GRV001</span>
                        </td>
                        <td>
                            <span th:text="${g.student.fullName}">Student</span>
                            <br>
                            <small class="text-muted" th:text="${g.student.studentId}">STU001</small>
                        </td>
                        <td th:text="${g.title}">Title</td>
                        <td>
                            <span class="badge bg-light text-dark" th:text="${g.department}">Finance</span>
                        </td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${g.status.name() == 'PENDING' ? 'bg-warning' :
                                                           (g.status.name() == 'IN_PROGRESS' ? 'bg-info' :
                                                            (g.status.name() == 'RESOLVED' ? 'bg-success' : 'bg-secondary'))}"
                                          th:text="${g.status}">PENDING</span>
                        </td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${g.priority.name() == 'URGENT' ? 'bg-danger' :
                                                           (g.priority.name() == 'HIGH' ? 'bg-warning' : 'bg-info')}"
                                          th:text="${g.priority}">MEDIUM</span>
                        </td>
                        <td>
                            <span th:if="${g.assignedTo}" th:text="${g.assignedTo.fullName}">Staff</span>
                            <span th:unless="${g.assignedTo}" class="text-muted">Unassigned</span>
                        </td>
                        <td th:text="${#temporals.format(g.createdAt, 'dd MMM yyyy')}">15 Jan</td>
                        <td th:text="${g.resolvedAt != null ? #temporals.format(g.resolvedAt, 'dd MMM yyyy') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
