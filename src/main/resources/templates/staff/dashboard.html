<!-- templates/staff/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Grievance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold">
                <i class="fas fa-tachometer-alt text-primary me-2"></i>
                Staff Dashboard
            </h1>
            <p class="text-muted">
                <i class="fas fa-user me-2"></i>Welcome, <span th:text="${user.fullName}">Staff</span> |
                <i class="fas fa-building ms-3 me-1"></i>Department: <span th:text="${user.department}">Finance</span>
            </p>
        </div>
    </div>

    <!-- Success Message -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- My Assigned Grievances -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header">
                    <i class="fas fa-tasks"></i> My Assigned Grievances
                    <span class="badge bg-primary ms-2" th:text="${myGrievances.size()}">0</span>
                </div>
                <div class="card-body">
                    <div th:if="${not #lists.isEmpty(myGrievances)}">
                        <div th:each="g : ${myGrievances}" class="border-bottom mb-3 pb-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <span class="badge bg-light text-dark me-2" th:text="${g.grievanceNumber}">GRV001</span>
                                    <span class="fw-semibold" th:text="${g.title}">Title</span>
                                </div>
                                <span class="badge"
                                      th:classappend="${g.priority.name() == 'URGENT' ? 'bg-danger' :
                                                           (g.priority.name() == 'HIGH' ? 'bg-warning' : 'bg-info')}"
                                      th:text="${g.priority}">MEDIUM</span>
                            </div>
                            <p class="small text-muted mb-2" th:text="${#strings.abbreviate(g.description, 100)}">Description</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small>
                                    <i class="fas fa-user me-1"></i> <span th:text="${g.student.fullName}">Student</span>
                                    <i class="fas fa-calendar ms-3 me-1"></i> <span th:text="${#temporals.format(g.createdAt, 'dd MMM')}">15 Jan</span>
                                </small>
                                <a th:href="@{/staff/grievance/{id}(id=${g.id})}" class="btn btn-sm btn-outline-primary">
                                    View & Update
                                </a>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(myGrievances)}" class="text-center py-4">
                        <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                        <p class="text-muted">No grievances assigned to you</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pending Department Grievances -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header">
                    <i class="fas fa-clock"></i> Pending Grievances (Unassigned)
                    <span class="badge bg-warning ms-2" th:text="${pendingGrievances.size()}">0</span>
                </div>
                <div class="card-body">
                    <div th:if="${not #lists.isEmpty(pendingGrievances)}">
                        <div th:each="g : ${pendingGrievances}" class="border-bottom mb-3 pb-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <span class="badge bg-light text-dark me-2" th:text="${g.grievanceNumber}">GRV001</span>
                                    <span class="fw-semibold" th:text="${g.title}">Title</span>
                                </div>
                                <span class="badge"
                                      th:classappend="${g.priority.name() == 'URGENT' ? 'bg-danger' :
                                                           (g.priority.name() == 'HIGH' ? 'bg-warning' : 'bg-info')}"
                                      th:text="${g.priority}">MEDIUM</span>
                            </div>
                            <p class="small text-muted mb-2" th:text="${#strings.abbreviate(g.description, 100)}">Description</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small>
                                    <i class="fas fa-user me-1"></i> <span th:text="${g.student.fullName}">Student</span>
                                </small>
                                <form th:action="@{/staff/grievance/{id}/assign(id=${g.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-success">
                                        <i class="fas fa-hand-paper me-1"></i> Assign to Me
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(pendingGrievances)}" class="text-center py-4">
                        <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                        <p class="text-muted">No pending grievances</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
